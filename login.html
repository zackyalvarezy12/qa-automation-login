<!DOCTYPE html>
<html>
<head>
    <title>Login HRIS</title>
</head>
<body>

    <h2>Login HRIS</h2>

    <input id="username" type="text" placeholder="Username">
    <br><br>

    <input id="password" type="password" placeholder="Password">
    <br><br>

    <button id="submit-login" onclick="login()">Masuk</button>

    <p id="message"></p>

    <script>
        function login() {
            let username = document.getElementById("username").value;
            let password = document.getElementById("password").value;
            let message = document.getElementById("message");

            if (username === "") {
                message.innerText = "Username wajib diisi";
            } 
            else if (username === "zacky" && password === "123456") {
                message.innerText = "Login berhasil";
            } 
            else {
                message.innerText = "Username atau password salah";
            }
        }
    </script>

</body>
</html>
